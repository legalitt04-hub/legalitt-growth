# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy.yml
#
# What this does automatically on every git push to main:
#   1. Runs backend syntax checks
#   2. Runs API tests
#   3. Triggers Render to redeploy the backend
#   4. Triggers Vercel to redeploy the frontend (if you add one later)
#
# Setup required (one-time):
#   GitHub repo → Settings → Secrets and variables → Actions → New secret:
#   - RENDER_API_KEY      (from Render dashboard → Account Settings → API Keys)
#   - RENDER_SERVICE_ID   (from Render dashboard → your service URL, e.g. srv-xxxxx)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Legalitt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check syntax on all files
        working-directory: backend
        run: |
          for f in $(find src -name "*.js"); do
            node --check "$f" || exit 1
          done
          echo "All files passed syntax check"

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_for_ci_only_not_real
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci_only
          MONGODB_URI: mongodb://localhost:27017/legalitt_test
          PORT: 5001

  # ── Job 2: Deploy to Render (only on push to main, not PRs) ─────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: test                      # Only runs if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
      - name: Trigger Render Deploy
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          curl --fail-with-body -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Use Render repository auto-deploy
        if: env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == ''
        run: echo "Render API secrets are not configured; waiting for the repository auto-deploy."

      - name: Verify exact deployment revision
        run: |
          EXPECTED_BUILD="${GITHUB_SHA:0:7}"
          for ATTEMPT in $(seq 1 30); do
            BODY=$(curl --fail --silent --show-error \
              https://legalitt-growth.onrender.com/health || true)
            LIVE_BUILD=$(printf '%s' "$BODY" | jq -r '.build // empty' 2>/dev/null)
            if [ "$LIVE_BUILD" = "$EXPECTED_BUILD" ]; then
              echo "Deployment successful — build $LIVE_BUILD is healthy"
              exit 0
            fi
            echo "Attempt $ATTEMPT/30: waiting for build $EXPECTED_BUILD (live: ${LIVE_BUILD:-unknown})"
            sleep 10
          done
          echo "Render did not expose expected build $EXPECTED_BUILD within five minutes"
          exit 1
